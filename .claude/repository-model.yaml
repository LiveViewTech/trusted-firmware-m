analysis:
  purpose:
    value: "Zephyr fork of Trusted Firmware-M (v2.2.2): implements the Arm PSA Secure Processing Environment (secure boot, SPM, and Crypto/ITS/PS/FWU/Attestation services) for Cortex-M and dual-core platforms."
    confidence: high
    evidence_refs:
      - entry-root-cmake
      - entry-zephyr-module
      - comp-secure-fw
      - comp-docs
      - fw-psa-ff-m
      - fw-zephyr-module
  architecture:
    value: "Optional BL1 and MCUboot-based BL2 authenticate images; SPM (secure_fw/spm) enforces isolation and dispatches PSA IPC/SFN calls to secure partitions; NSPE clients use interface/ PSA APIs. Platform HAL under platform/ext/target supplies board-specific drivers. CMake + optional Kconfig select profiles, toolchain, and fetched deps under lib/ext."
    confidence: high
    evidence_refs:
      - entry-spm-main
      - entry-bl2-main
      - comp-partitions
      - comp-platform
      - comp-interface
      - comp-config
      - fw-cmake
  patterns:
    - id: pat-cmake-fetchcontent
      value: External deps default to DOWNLOAD via CMake FetchContent into build/lib/ext; override with *_PATH caches in config_base.cmake.
      confidence: high
      evidence_refs:
        - dep-mbedcrypto
        - dep-mcuboot
        - comp-lib
        - comp-config
    - id: pat-manifest-codegen
      value: Partition manifests (YAML) listed in tools/tfm_manifest_list.yaml are processed by tfm_parse_manifest_list.py to generate load info and interfaces.
      confidence: high
      evidence_refs:
        - entry-manifest-parser
        - comp-tools
        - comp-partitions
    - id: pat-profiles
      value: Predefined TF-M profiles (small/medium/medium_arotless/large) under config/profile tune which services and isolation features are built.
      confidence: high
      evidence_refs:
        - comp-config
        - fw-psa-ff-m
    - id: pat-toolchain-files
      value: Cross-compile via TFM_TOOLCHAIN_FILE (GNUARM default; ARMCLANG, CLANG, IARARM alternatives at repo root).
      confidence: high
      evidence_refs:
        - fw-cmake
        - cmd-configure
        - cmd-configure-debug
        - comp-config
    - id: pat-dco-signed-off
      value: Contributions require git commit -s (DCO Signed-off-by) per contributing_process.rst.
      confidence: high
      evidence_refs:
        - comp-docs
  component_notes:
    - ref: comp-bl1
      purpose: Early boot stages (BL1_1/BL1_2) for platforms that enable BL1; OTP/provisioning and measurement before BL2.
      confidence: high
    - ref: comp-bl2
      purpose: MCUboot-based second-stage secure boot validating SPE/NSPE images before jumping to secure firmware.
      confidence: high
    - ref: comp-secure-fw
      purpose: SPE binary (tfm_s) aggregating SPM, shared runtime, and secure partitions.
      confidence: high
    - ref: comp-spm
      purpose: Isolation setup (FIH-wrapped HAL), PSA API dispatch, IPC or SFN backend selection.
      confidence: high
    - ref: comp-partitions
      purpose: PSA secure services (crypto, ITS, PS, attestation, FWU) plus NS agents and idle partition.
      confidence: high
    - ref: comp-platform
      purpose: Vendor/board targets and common HAL (boot, faults, drivers); largest tree under platform/ext/target.
      confidence: high
    - ref: comp-interface
      purpose: Headers and NS veneers for PSA Functional APIs consumed by NSPE after install to api_ns.
      confidence: high
    - ref: comp-lib
      purpose: FIH, logging helpers, and FetchContent wrappers for Mbed Crypto, MCUboot, CMSIS, QCBOR, t_cose.
      confidence: high
    - ref: comp-tools
      purpose: Python manifest parsing, Kconfig helper, image/signing utilities; needs tools/requirements.txt.
      confidence: high
    - ref: comp-config
      purpose: Default CMake/Kconfig options, isolation/FIH/backend knobs, and profile presets.
      confidence: high
    - ref: comp-cmake
      purpose: Version detection, install layout, remote_library and SPE CMake helpers.
      confidence: high
    - ref: comp-docs
      purpose: Sphinx user guide and reference manuals; built via cmake -S docs or Read the Docs.
      confidence: high
    - ref: comp-zephyr
      purpose: Declares this tree as Zephyr external module trusted-firmware-m with cmake/kconfig extensions and CPE metadata for TF-Mv2.2.2.
      confidence: high
  service_notes:
    - ref: svc-readthedocs
      purpose: Hosts published TF-M documentation builds from docs/.
      integration: .readthedocs.yaml drives Sphinx with docs/requirements.txt on Ubuntu 22.04 / Python 3.11.
      confidence: high
    - ref: svc-tf-gerrit
      purpose: Upstream review host for TF-M contributions.
      integration: .gitreview points at review.trustedfirmware.org project TF-M/trusted-firmware-m.
      confidence: high
    - ref: svc-upstream-tfm
      purpose: Canonical TF-M source this Zephyr fork tracks.
      integration: README.md and introduction docs cite git.trustedfirmware.org/TF-M/trusted-firmware-m.git.
      confidence: high
    - ref: svc-github-deps
      purpose: Source hosts for automatically fetched build dependencies.
      integration: CMake DOWNLOAD paths pull mbedtls, mcuboot, CMSIS_6 from GitHub during configure.
      confidence: high
  dangerous_areas:
    - id: dang-isolation-fih
      value: TFM_ISOLATION_LEVEL and TFM_FIH_PROFILE change security guarantees and code paths in SPM/boot.
      reason: Wrong level/profile can weaken isolation or alter FIH checks without obvious build failure; defaults are level 1 and FIH OFF.
      confidence: high
      evidence_refs:
        - comp-config
        - entry-spm-main
        - dep-fih
    - id: dang-platform-selection
      value: TFM_PLATFORM must match a real path under platform/ext/target (or absolute out-of-tree path).
      reason: Build is platform-specific; wrong/missing platform fails configure or produces unusable images.
      confidence: high
      evidence_refs:
        - cmd-configure
        - comp-platform
        - comp-config
    - id: dang-dep-download
      value: Default DOWNLOAD fetches pinned third-party trees (network + exact tags required).
      reason: Offline or tag mismatch breaks configure; localrepos.cmake / *_PATH overrides change provenance of crypto and boot code.
      confidence: high
      evidence_refs:
        - dep-mbedcrypto
        - dep-mcuboot
        - entry-root-cmake
        - pat-cmake-fetchcontent
    - id: dang-tests-external
      value: Regression/PSA tests live in separate tf-m-tests repo, not this tree.
      reason: CONFIG_TFM_TEST_DIR only works if tests are cloned and revision matches lib/ext/tf-m-tests/version.txt (TF-Mv2.2.2).
      confidence: high
      evidence_refs:
        - test-tf-m-tests
        - cmd-clone-tests
        - entry-root-cmake
    - id: dang-keys-provisioning
      value: Boot keys and OTP/provisioning under BL1/BL2 and platform HAL are security-critical.
      reason: Tree ships sample PEMs and keys.c under bl2/ext/mcuboot/; production must replace these and align OTP/provisioning or secure boot authenticity fails.
      confidence: high
      evidence_refs:
        - entry-bl2-main
        - entry-bl1-1-main
        - comp-bl2
        - comp-platform
  questions:
    - id: q-liveview-fork-delta
      question: Beyond Zephyr sync tagging noted in README.md, what LiveViewTech-specific patches or policies diverge this GitHub fork (LiveViewTech/trusted-firmware-m) from zephyrproject-rtos/trusted-firmware-m or upstream TF-M?
      area: ownership / fork policy
      priority: high
      evidence_refs:
        - entry-zephyr-module
        - fw-zephyr-module
    - id: q-default-platform-lvt
      question: Which TFM_PLATFORM (if any) is the intended default for LiveViewTech products, given docs exemplify arm/mps2/an521?
      area: platform
      priority: high
      evidence_refs:
        - cmd-configure
        - comp-platform
    - id: q-zephyr-integration-path
      question: How is this module consumed in Zephyr west manifests for LiveViewTech (module path, version pins, out-of-tree platforms)?
      area: zephyr integration
      priority: medium
      evidence_refs:
        - entry-zephyr-module
        - fw-zephyr-module
    - id: q-branch-strategy
      question: What is the relationship and sync cadence between zephyr_tf-m_v2.2.2 and zephyr_tf-m_v2.3.0 branches on this remote?
      area: release process
      priority: medium
      evidence_refs:
        - entry-zephyr-module
        - comp-cmake
